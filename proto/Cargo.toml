# Phase 0 prototype host (plan.md §6, "a scratch gpui host"): a gpui window
# with one pane showing a NotolibraEngine tab, driven by hidden checks.
# Standalone: it touches nothing in the app's native/ tree, but builds against
# the same gpui-kit / GPUI Fast versions and the app's vendored patches
# (read-only paths), and starts from a copy of its Cargo.lock.
[package]
name = "notolibra-engine-proto"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
gpui-kit = { version = "=0.7.3", features = ["gpui-fast"] }
objc2 = "0.6"
objc2-foundation = "0.3"
raw-window-handle = "0.6"

[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 2
debug-assertions = false

[patch.crates-io]
gpui-fast-macos = { path = "../../../../notolibra/native/vendor/gpui-fast-macos" }
gpui-fast = { path = "../../../../notolibra/native/vendor/gpui-fast" }
gpui-component = { path = "../../../../notolibra/native/vendor/gpui-component" }
